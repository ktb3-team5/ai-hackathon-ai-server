name: Deploy AI Server to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4

    - name: 🔑 SSH 설정 (KeepAlive 포함)
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
        
        # SSH 연결 유지 설정
        cat >> ~/.ssh/config << EOF
        Host ${{ secrets.EC2_HOST }}
          ServerAliveInterval 60
          ServerAliveCountMax 10
          TCPKeepAlive yes
        EOF

    - name: 📦 EC2로 파일 전송
      run: |
        echo "파일 전송 시작..."
        rsync -avz --delete \
          -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ServerAliveInterval=60" \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='chroma_db' \
          --exclude='logs' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          --exclude='.env' \
          ./ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/ai-hackathon-ai-server/
        echo "✅ 파일 전송 완료"

    - name: 🚀 EC2에서 배포 실행
      run: |
        ssh -i ~/.ssh/id_rsa \
          -o StrictHostKeyChecking=no \
          -o ServerAliveInterval=60 \
          -o ServerAliveCountMax=10 \
          -o TCPKeepAlive=yes \
          ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
          set -e
          
          cd ~/ai-hackathon-ai-server
          
          echo "=========================================="
          echo "🚀 AI 서버 배포 시작"
          echo "=========================================="
          
          # Docker Compose 명령어 확인
          if command -v docker-compose &> /dev/null; then
            DOCKER_COMPOSE="docker-compose"
          elif docker compose version &> /dev/null; then
            DOCKER_COMPOSE="docker compose"
          else
            echo "❌ Docker Compose를 찾을 수 없습니다!"
            exit 1
          fi
          
          echo "✅ Docker Compose: $DOCKER_COMPOSE"
          
          # ==========================================
          # 🧹 1단계: 배포 전 공격적인 공간 확보
          # ==========================================
          echo ""
          echo "================================================"
          echo "🧹 1단계: 배포 전 디스크 대청소"
          echo "================================================"
          echo ""
          echo "📊 현재 디스크 사용량:"
          df -h /
          echo ""
          docker system df || true
          echo ""
          
          # 기존 컨테이너 중지 및 삭제
          echo "⏹️  기존 컨테이너 중지 및 삭제..."
          $DOCKER_COMPOSE down || true
          
          # 🔥 모든 Docker 리소스 정리 (단, 실행 중인 컨테이너 제외)
          echo ""
          echo "🔥 Docker 완전 정리 시작..."
          
          # 1. 중지된 모든 컨테이너 삭제
          echo "  - 중지된 컨테이너 삭제 중..."
          docker container prune -f
          
          # 2. 사용하지 않는 모든 이미지 삭제 (dangling + unused)
          echo "  - 사용하지 않는 모든 이미지 삭제 중..."
          docker image prune -a -f
          
          # 3. 사용하지 않는 볼륨 삭제
          echo "  - 사용하지 않는 볼륨 삭제 중..."
          docker volume prune -f
          
          # 4. 사용하지 않는 네트워크 삭제
          echo "  - 사용하지 않는 네트워크 삭제 중..."
          docker network prune -f
          
          # 5. 모든 빌드 캐시 삭제
          echo "  - 모든 빌드 캐시 삭제 중..."
          docker builder prune -a -f
          
          # 6. /tmp 정리
          echo "  - /tmp 임시 파일 정리 중..."
          sudo find /tmp -type f -atime +2 -delete 2>/dev/null || true
          
          # 7. 로그 파일 정리 (선택사항)
          echo "  - 오래된 로그 정리 중..."
          sudo find /var/log -name "*.log" -type f -size +100M -delete 2>/dev/null || true
          sudo journalctl --vacuum-size=100M 2>/dev/null || true
          
          echo ""
          echo "✅ 정리 완료!"
          echo ""
          echo "📊 정리 후 디스크 상태:"
          df -h /
          echo ""
          docker system df || true
          
          # ==========================================
          # 🔍 2단계: 충분한 공간 확보 확인
          # ==========================================
          echo ""
          echo "================================================"
          echo "🔍 2단계: 디스크 공간 검증"
          echo "================================================"
          echo ""
          
          AVAILABLE_KB=$(df / | tail -1 | awk '{print $4}')
          AVAILABLE_GB=$((AVAILABLE_KB / 1024 / 1024))
          
          echo "현재 여유 공간: ${AVAILABLE_GB}GB (${AVAILABLE_KB}KB)"
          
          if [ $AVAILABLE_KB -lt 3000000 ]; then
            echo ""
            echo "❌ 경고: 여유 공간이 3GB 미만입니다!"
            echo "   현재: ${AVAILABLE_GB}GB"
            echo "   필요: 최소 3GB"
            echo ""
            echo "🆘 긴급 조치: 추가 정리 시도 중..."
            
            # 긴급 정리: 모든 이미지 강제 삭제
            echo "  - 모든 Docker 이미지 강제 삭제..."
            docker rmi -f $(docker images -q) 2>/dev/null || true
            
            # 긴급 정리: apt 캐시
            echo "  - APT 캐시 정리..."
            sudo apt-get clean 2>/dev/null || true
            sudo apt-get autoclean 2>/dev/null || true
            
            echo ""
            echo "추가 정리 후:"
            df -h /
            
            AVAILABLE_KB=$(df / | tail -1 | awk '{print $4}')
            AVAILABLE_GB=$((AVAILABLE_KB / 1024 / 1024))
            
            if [ $AVAILABLE_KB -lt 3000000 ]; then
              echo ""
              echo "❌ 치명적 오류: 여전히 공간이 부족합니다!"
              echo "   현재: ${AVAILABLE_GB}GB"
              echo ""
              echo "💡 해결 방법:"
              echo "   1. EC2 EBS 볼륨을 20GB로 확장하세요"
              echo "   2. AWS 콘솔 → EC2 → Volumes → Modify Volume → 20GB"
              echo "   3. EC2에서 실행:"
              echo "      sudo growpart /dev/xvda 1"
              echo "      sudo resize2fs /dev/xvda1"
              echo ""
              exit 1
            fi
          fi
          
          echo "✅ 충분한 공간 확보됨: ${AVAILABLE_GB}GB"
          
          # ==========================================
          # 🔧 3단계: BuildKit 활성화
          # ==========================================
          echo ""
          echo "================================================"
          echo "🔧 3단계: BuildKit 활성화"
          echo "================================================"
          echo ""
          
          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1
          
          echo "✅ DOCKER_BUILDKIT=1"
          echo "✅ COMPOSE_DOCKER_CLI_BUILD=1"
          
          # ==========================================
          # 🔨 4단계: Docker 이미지 빌드
          # ==========================================
          echo ""
          echo "================================================"
          echo "🔨 4단계: Docker 이미지 빌드"
          echo "================================================"
          echo ""
          echo "⏳ 빌드 시작... (3-5분 예상)"
          echo "   - requirements.txt 경량화로 70% 시간 단축"
          echo "   - BuildKit으로 20% 추가 향상"
          echo ""
          
          BUILD_START=$(date +%s)
          
          $DOCKER_COMPOSE build --build-arg BUILDKIT_INLINE_CACHE=1
          
          BUILD_END=$(date +%s)
          BUILD_TIME=$((BUILD_END - BUILD_START))
          BUILD_MIN=$((BUILD_TIME / 60))
          BUILD_SEC=$((BUILD_TIME % 60))
          
          echo ""
          echo "✅ 빌드 완료! (소요 시간: ${BUILD_MIN}분 ${BUILD_SEC}초)"
          
          # ==========================================
          # 📦 5단계: ChromaDB 초기화 (SQL → Vector DB)
          # ==========================================
          echo ""
          echo "================================================"
          echo "📦 5단계: ChromaDB 초기화 (SQL → Vector DB)"
          echo "================================================"
          echo ""
          
          # chroma_db 디렉토리 생성 (없을 경우)
          mkdir -p ./chroma_db
          
          # ChromaDB가 비어있거나 없으면 초기화
          if [ ! -d "./chroma_db" ] || [ -z "$(ls -A ./chroma_db 2>/dev/null)" ]; then
            echo "📦 ChromaDB가 비어있음. SQL 데이터로 초기화 중..."
            echo "   - init.sql 파일에서 여행지 데이터 파싱"
            echo "   - 벡터 임베딩 생성 및 저장"
            echo "   - 예상 소요 시간: 2-3분"
            echo ""
            
            $DOCKER_COMPOSE run --rm ai-server python init_chroma_from_sql.py
            
            echo ""
            echo "✅ ChromaDB 초기화 완료!"
          else
            echo "✅ ChromaDB 데이터 존재"
            echo ""
            echo "💡 기존 데이터를 유지합니다."
            echo "   데이터를 재생성하려면 chroma_db 폴더를 삭제하세요:"
            echo "   rm -rf ./chroma_db/*"
          fi
          
          # ==========================================
          # ▶️ 6단계: 컨테이너 시작
          # ==========================================
          echo ""
          echo "================================================"
          echo "▶️  6단계: 컨테이너 시작"
          echo "================================================"
          echo ""
          
          $DOCKER_COMPOSE up -d
          
          echo "⏳ 서버 시작 대기 중..."
          sleep 15
          
          # ==========================================
          # ✅ 7단계: 배포 검증
          # ==========================================
          echo ""
          echo "================================================"
          echo "✅ 7단계: 배포 검증"
          echo "================================================"
          echo ""
          
          echo "📋 최근 로그:"
          $DOCKER_COMPOSE logs --tail=30
          
          echo ""
          echo "📊 컨테이너 상태:"
          $DOCKER_COMPOSE ps
          
          echo ""
          echo "💾 최종 디스크 상태:"
          df -h /
          docker system df
          
          # ==========================================
          # 🎉 배포 완료
          # ==========================================
          echo ""
          echo "=========================================="
          echo "🎉 배포 완료!"
          echo "=========================================="
          echo ""
          echo "📍 서버 접속 정보:"
          echo "   - API: http://3.34.178.178:8000"
          echo "   - 문서: http://3.34.178.178:8000/docs"
          echo "   - 헬스: http://3.34.178.178:8000/health"
          echo ""
          echo "💡 명령어:"
          echo "   - 로그 확인: docker-compose logs -f"
          echo "   - 컨테이너 상태: docker-compose ps"
          echo "   - 디스크 확인: df -h"
          echo ""
        ENDSSH

    - name: 📢 배포 완료
      run: |
        echo ""
        echo "=========================================="
        echo "🎉 배포 성공!"
        echo "=========================================="
        echo ""
        echo "✨ 주요 개선 사항:"
        echo "  - 배포 전 Docker 완전 정리"
        echo "  - requirements.txt 70% 경량화"
        echo "  - BuildKit 활성화"
        echo "  - 최소 3GB 공간 보장"
        echo ""
        echo "📊 예상 빌드 시간: 3-5분"
        echo ""
        echo "서버 확인:"
        echo "  curl http://${{ secrets.EC2_HOST }}:8000/health"
        echo ""