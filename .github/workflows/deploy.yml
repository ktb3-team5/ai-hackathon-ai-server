name: Deploy AI Server to EC2

on:
  push:
    branches: [ feat/cicd ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4

    - name: 🔑 SSH 설정
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: 📦 EC2로 파일 전송
      run: |
        echo "파일 전송 시작..."
        rsync -avz --delete \
          -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='chroma_db' \
          --exclude='logs' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          --exclude='.env' \
          ./ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/ai-hackathon-ai-server/
        echo "✅ 파일 전송 완료"

    - name: 🚀 EC2에서 배포 실행
      run: |
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
          ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
          set -e
          
          cd ~/ai-hackathon-ai-server
          
          echo "=========================================="
          echo "🚀 AI 서버 배포 시작"
          echo "=========================================="
          
          # 기존 컨테이너 중지 및 제거
          echo "⏹️  기존 컨테이너 중지 중..."
          docker-compose down || true
          
          # 이미지 빌드 (캐시 활용)
          echo "🔨 Docker 이미지 빌드 중..."
          docker-compose build
          
          # ChromaDB 데이터 초기화 (첫 배포 시에만)
          if [ ! -d "./chroma_db" ] || [ -z "$(ls -A ./chroma_db 2>/dev/null)" ]; then
            echo "📦 ChromaDB 초기화 중..."
            docker-compose run --rm ai-server python init_chroma_from_sql.py
            echo "✅ ChromaDB 초기화 완료"
          else
            echo "✅ ChromaDB 데이터가 이미 존재합니다"
          fi
          
          # 컨테이너 시작
          echo "▶️  컨테이너 시작 중..."
          docker-compose up -d
          
          # 잠시 대기
          echo "⏳ 서버 시작 대기 중..."
          sleep 15
          
          # 로그 확인
          echo "📋 최근 로그:"
          docker-compose logs --tail=30
          
          # 컨테이너 상태 확인
          echo ""
          echo "📊 컨테이너 상태:"
          docker-compose ps
          
          echo ""
          echo "=========================================="
          echo "✅ 배포 완료!"
          echo "=========================================="
        ENDSSH

    - name: 🏥 헬스 체크
      run: |
        echo "헬스 체크 중..."
        sleep 10
        
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}:8000/health || echo "000")
        
        if [ "$RESPONSE" = "200" ]; then
          echo "✅ 서버가 정상적으로 작동 중입니다!"
          curl -s http://${{ secrets.EC2_HOST }}:8000/health | jq '.' || curl -s http://${{ secrets.EC2_HOST }}:8000/health
        else
          echo "❌ 서버 응답 실패 (HTTP $RESPONSE)"
          exit 1
        fi

    - name: 📢 배포 결과 알림
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "🎉 배포 성공!"
          echo "서버 주소: http://${{ secrets.EC2_HOST }}:8000"
          echo "API 문서: http://${{ secrets.EC2_HOST }}:8000/docs"
          echo "헬스 체크: http://${{ secrets.EC2_HOST }}:8000/health"
        else
          echo "❌ 배포 실패"
        fi