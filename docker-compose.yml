version: '3.8'

services:
  ai-server:
    build: .
    container_name: ai-hackathon-server
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=*
      - CHROMA_DB_PATH=/app/chroma_db
      - CHROMA_COLLECTION_NAME=travel_places
      - EMBEDDING_MODEL=jhgan/ko-sroberta-multitask
    volumes:
      # ChromaDB 데이터 영구 저장
      - ./chroma_db:/app/chroma_db
      # 로그 저장 (선택사항)
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"